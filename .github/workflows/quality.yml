{
  "name": "Windows Python quality",
  "on": {
    "push": {
      "branches": [
        "main",
        "codex/jarvis-quality-improvements"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "quality-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "quality": {
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "env": {
        "JARVIS_AI_PROVIDER": "disabled",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Patch installer certificate trust",
          "run": "python -m pip --isolated install --only-binary=:all: --no-deps --upgrade pip==26.2.2"
        },
        {
          "name": "Install existing runtime requirements",
          "run": "python -m pip install -r requirements.txt"
        },
        {
          "name": "Dependency consistency",
          "run": "python -m pip check"
        },
        {
          "name": "Syntax, hygiene and publication safety",
          "run": "python -B JARVIS.PY/tools/validate.py"
        },
        {
          "name": "Mocked regression suite",
          "run": "python -B -m unittest discover -s JARVIS.PY/tests -v"
        },
        {
          "name": "Whitespace",
          "run": "python -B JARVIS.PY/tools/check_diff.py"
        },
        {
          "name": "Create isolated audit environment",
          "run": "python -m venv .venv-audit"
        },
        {
          "name": "Patch audit installer trust",
          "run": ".\\.venv-audit\\Scripts\\python.exe -m pip --isolated install --only-binary=:all: --no-deps --upgrade pip==26.2.2"
        },
        {
          "name": "Install pinned audit tooling",
          "run": ".\\.venv-audit\\Scripts\\python.exe -m pip --isolated install --only-binary=:all: -r requirements-audit.txt"
        },
        {
          "name": "Audit tooling dependency consistency",
          "run": ".\\.venv-audit\\Scripts\\python.exe -m pip check"
        },
        {
          "name": "Audit runtime vulnerabilities",
          "run": "$runtimeSite = python -c \"import sysconfig; print(sysconfig.get_paths()['purelib'])\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n.\\.venv-audit\\Scripts\\python.exe -B JARVIS.PY/tools/audit_dependencies.py --path \"$runtimeSite\""
        },
        {
          "name": "Audit scanner vulnerabilities",
          "run": ".\\.venv-audit\\Scripts\\python.exe -B JARVIS.PY/tools/audit_dependencies.py --path .venv-audit/Lib/site-packages"
        }
      ]
    }
  }
}
